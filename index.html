<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись на курс</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #1c2430;
      --muted: #5c6b7a;
      --line: #d5dde6;
      --accent: #0f6e6b;
      --accent-dark: #0b5552;
      --error: #b42318;
      --ok: #067647;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 28px 24px;
      box-shadow: 0 10px 30px rgba(28, 36, 48, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }

    .lead {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.45;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      font: inherit;
      color: inherit;
      background: #fff;
    }

    input:focus {
      outline: 2px solid rgba(15, 110, 107, 0.25);
      border-color: var(--accent);
    }

    .field { margin-bottom: 14px; }

    .error {
      display: block;
      min-height: 18px;
      margin-top: 4px;
      color: var(--error);
      font-size: 13px;
    }

    button {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: var(--accent-dark); }

    #success {
      margin-top: 8px;
      padding: 16px;
      border-radius: 10px;
      background: #ecfdf3;
      color: var(--ok);
    }

    #success h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    #success p { margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Запись на курс тестирования</h1>
    <p class="lead">Заполните форму, чтобы оставить заявку на курс.</p>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="name">Имя</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <span class="error" id="name-error"></span>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <span class="error" id="email-error"></span>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="new-password">
        <span class="error" id="password-error"></span>
      </div>
      <button type="submit" id="submit-btn">Зарегистрироваться</button>
    </form>

    <div id="success" hidden>
      <h2>Заявка принята</h2>
      <p id="success-text"></p>
    </div>
  </main>

  <script>
    const form = document.getElementById("signup-form");
    const success = document.getElementById("success");
    const successText = document.getElementById("success-text");

    const fields = {
      name: {
        input: document.getElementById("name"),
        error: document.getElementById("name-error"),
        validate(value) {
          if (value.trim().length < 2) {
            return "Введите имя не короче 2 символов";
          }
          return "";
        }
      },
      email: {
        input: document.getElementById("email"),
        error: document.getElementById("email-error"),
        validate(value) {
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim())) {
            return "Введите корректный email";
          }
          return "";
        }
      },
      password: {
        input: document.getElementById("password"),
        error: document.getElementById("password-error"),
        validate(value) {
          if (value.length < 6) {
            return "Пароль должен быть не короче 6 символов";
          }
          return "";
        }
      }
    };

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      let valid = true;

      Object.values(fields).forEach((field) => {
        const message = field.validate(field.input.value);
        field.error.textContent = message;
        if (message) valid = false;
      });

      if (!valid) {
        success.hidden = true;
        return;
      }

      const name = fields.name.input.value.trim();
      successText.textContent = "Спасибо, " + name + ". Мы свяжемся с вами по почте.";
      success.hidden = false;
      form.hidden = true;
    });
  </script>
</body>
</html>
